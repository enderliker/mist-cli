[package]
name = "mist-cli"
version = "0.3.0-beta.1"
edition = "2021"


[dependencies]
mistral-client = { path = "../mistral-client" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
thiserror = "2.0"
colored = "2.2"
rustyline = "14.0"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.10"
